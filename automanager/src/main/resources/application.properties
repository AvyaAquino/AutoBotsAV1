# Banco em memória H2 (os dados somem ao reiniciar a aplicação)
spring.datasource.url=jdbc:h2:mem:automanager
spring.datasource.username=sa
spring.datasource.password=
# Console web do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:automanager)
spring.h2.console.enabled=true
# Datas no JSON no formato AAAA-MM-DD
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Sao_Paulo
